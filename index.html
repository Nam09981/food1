<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ครัวโลก — สมุดสูตรอาหารนานาชาติ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Libre+Franklin:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#241c14; --paper:#f4ecd8; --paper2:#ece0c4; --saffron:#d99a1b;
  --saffron-d:#a97511; --teal:#1f5c53; --chili:#b23a2e; --muted:#8a7960;
  --line:#d8c9a6; --card:#fbf6ea;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#f3ead7; --paper:#1b1712; --paper2:#241f18; --saffron:#e8b13c;
    --saffron-d:#f2c565; --teal:#4fae9c; --chili:#e2685a; --muted:#a8977f;
    --line:#3a3226; --card:#241f18;
  }
}
:root[data-theme="dark"]{
  --ink:#f3ead7; --paper:#1b1712; --paper2:#241f18; --saffron:#e8b13c;
  --saffron-d:#f2c565; --teal:#4fae9c; --chili:#e2685a; --muted:#a8977f;
  --line:#3a3226; --card:#241f18;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  font-family:'Libre Franklin',system-ui,-apple-system,sans-serif;
  background:var(--paper); color:var(--ink);
  padding-top:env(safe-area-inset-top,0px); padding-bottom:calc(78px + env(safe-area-inset-bottom,0px));
  min-height:100vh; -webkit-font-smoothing:antialiased;
}
header{background:var(--paper2); padding:26px 20px 20px; border-bottom:1px solid var(--line)}
header .eyebrow{font-size:12px;color:var(--saffron-d);font-weight:700}
header h1{font-family:'Fraunces',serif; font-weight:700; font-size:30px; margin-top:4px; line-height:1.15}
header p{font-size:13.5px;color:var(--muted);margin-top:6px;max-width:32ch;line-height:1.5}

.search-row{padding:16px 20px 0; display:flex; gap:8px}
#search{flex:1; font-family:inherit; font-size:15px; padding:12px 14px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink)}
#search:focus{outline:2px solid var(--saffron); outline-offset:1px}
#shuffleBtn{font-family:inherit; font-size:13px; font-weight:700; color:var(--card); background:var(--teal); border:none; border-radius:10px; padding:0 16px; cursor:pointer; white-space:nowrap}
#shuffleBtn:active{transform:scale(.97)}

.chips{display:flex;gap:8px;overflow-x:auto;padding:16px 20px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto; font-family:inherit; font-size:13px; font-weight:500; padding:7px 14px; border-radius:999px; background:var(--card); border:1px solid var(--line); color:var(--ink); cursor:pointer; white-space:nowrap}
.chip.active{background:var(--teal); border-color:var(--teal); color:var(--card); font-weight:700}

.count-row{padding:10px 20px 0; font-size:12.5px; color:var(--muted)}
main{padding:14px 20px 24px}
.list{display:flex; flex-direction:column; gap:12px}

.entry{position:relative; display:flex; gap:14px; align-items:flex-start; background:var(--card); border:1px solid var(--line); border-radius:4px; padding:14px 44px 14px 16px; cursor:pointer}
.entry::before{content:""; position:absolute; left:0; top:12px; bottom:12px; width:3px; background:var(--saffron)}
.entry .emoji{font-size:30px; line-height:1; margin-top:2px}
.entry .meta-top{font-size:11px; font-weight:700; color:var(--teal)}
.entry h3{font-family:'Fraunces',serif; font-size:18px; font-weight:600; margin:2px 0 5px; line-height:1.25}
.entry .sub{font-size:12px; color:var(--muted)}
.fav-btn{position:absolute; right:10px; top:14px; background:none; border:none; font-size:19px; cursor:pointer; color:var(--line); line-height:1}
.fav-btn.active{color:var(--chili)}
.empty{text-align:center; padding:50px 20px; color:var(--muted); font-size:14px}

nav.tabbar{position:fixed; bottom:0; left:0; right:0; background:var(--paper2); border-top:1px solid var(--line); display:flex; z-index:20; padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabbar button{flex:1; background:none; border:none; padding:10px 4px 8px; font-family:inherit; font-size:11.5px; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer}
nav.tabbar button .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:0}
nav.tabbar button.active{color:var(--saffron-d); font-weight:700}
nav.tabbar button.active .dot{opacity:1}

.install-toast{position:fixed; bottom:calc(72px + env(safe-area-inset-bottom,0px)); left:14px; right:14px; background:var(--ink); color:var(--paper); padding:11px 14px; border-radius:12px; display:none; align-items:center; justify-content:space-between; font-size:13px; z-index:30}
.install-toast.show{display:flex}
.install-toast button{background:var(--saffron); color:var(--ink); border:none; padding:6px 12px; border-radius:8px; font-size:12px; font-weight:700; font-family:inherit; cursor:pointer}

/* full-screen recipe reader */
.reader{position:fixed; inset:0; background:var(--paper); z-index:100; transform:translateX(100%); transition:transform .32s cubic-bezier(.22,.68,0,1); overflow-y:auto; display:flex; flex-direction:column}
.reader.open{transform:translateX(0)}
.reader-hero{position:relative; padding:calc(20px + env(safe-area-inset-top,0px)) 20px 30px; background:linear-gradient(135deg,var(--saffron),var(--chili)); flex-shrink:0}
.reader-hero .row{display:flex; align-items:center; justify-content:space-between}
.icon-btn{width:38px; height:38px; border-radius:50%; border:none; background:rgba(255,255,255,.28); color:#fff; font-size:17px; cursor:pointer; display:flex; align-items:center; justify-content:center; backdrop-filter:blur(2px)}
.icon-btn.fav.active{background:#fff; color:var(--chili)}
.reader-hero .big-emoji{font-size:76px; text-align:center; margin:14px 0 4px; line-height:1}
.reader-hero .cuisine-tag{text-align:center; font-size:12.5px; font-weight:700; color:#fff; opacity:.92}
.reader-hero h2{font-family:'Fraunces',serif; font-weight:900; font-size:27px; text-align:center; color:#fff; margin-top:6px; line-height:1.2}
.reader-meta{display:flex; justify-content:center; gap:10px; padding:16px 20px 0}
.reader-meta span{font-size:12px; background:var(--card); border:1px solid var(--line); color:var(--muted); padding:5px 12px; border-radius:999px}
.reader-body{padding:22px 22px 50px; max-width:560px; margin:0 auto; width:100%}
.reader-body h4{font-family:'Fraunces',serif; font-size:17px; font-weight:700; color:var(--saffron-d); margin:22px 0 12px; display:flex; align-items:center; gap:8px}
.reader-body h4:first-child{margin-top:0}
.ing-list{list-style:none; display:flex; flex-direction:column; gap:9px}
.ing-list li{display:flex; align-items:center; gap:11px; font-size:14.5px; padding:10px 12px; background:var(--card); border:1px solid var(--line); border-radius:8px; cursor:pointer; user-select:none}
.ing-list li .box{width:19px; height:19px; border-radius:5px; border:2px solid var(--teal); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--card)}
.ing-list li.checked .box{background:var(--teal)}
.ing-list li.checked span.txt{text-decoration:line-through; color:var(--muted)}
.step-list{list-style:none; display:flex; flex-direction:column}
.step-list li{display:flex; gap:14px; position:relative; padding-bottom:22px}
.step-list li:last-child{padding-bottom:0}
.step-list li::before{content:""; position:absolute; left:14px; top:30px; bottom:0; width:2px; background:var(--line)}
.step-list li:last-child::before{display:none}
.step-num{width:29px; height:29px; border-radius:50%; background:var(--teal); color:var(--card); font-family:'Fraunces',serif; font-weight:700; font-size:13.5px; display:flex; align-items:center; justify-content:center; flex-shrink:0; z-index:1}
.step-list p{font-size:14.5px; line-height:1.65; padding-top:3px}
</style>
</head>
<body>

<header>
  <div class="eyebrow">สมุดสูตรอาหาร</div>
  <h1>ครัวโลก</h1>
  <p>รวมสูตรอาหารจากทั่วทุกมุมโลก พร้อมวิธีทำทีละขั้นตอน</p>
</header>

<div class="search-row">
  <input id="search" type="text" placeholder="ค้นหาเมนู เช่น ผัดไทย, ซูชิ...">
  <button id="shuffleBtn">สุ่มเมนู</button>
</div>

<div class="chips" id="chips"></div>
<div class="count-row" id="count"></div>

<main><div class="list" id="list"></div></main>

<div class="install-toast" id="installToast">
  <span>ติดตั้งแอปนี้ไว้ในเครื่อง</span>
  <button id="installBtn">ติดตั้ง</button>
</div>

<nav class="tabbar">
  <button class="active" data-tab="home"><span class="dot"></span>เมนูทั้งหมด</button>
  <button data-tab="fav"><span class="dot"></span>รายการโปรด</button>
</nav>

<div class="reader" id="reader">
  <div class="reader-hero">
    <div class="row">
      <button class="icon-btn" id="backBtn" aria-label="ย้อนกลับ">←</button>
      <button class="icon-btn fav" id="readerFav" aria-label="บันทึกรายการโปรด">♡</button>
    </div>
    <div class="big-emoji" id="readerEmoji"></div>
    <div class="cuisine-tag" id="readerCuisine"></div>
    <h2 id="readerName"></h2>
  </div>
  <div class="reader-meta" id="readerMeta"></div>
  <div class="reader-body">
    <h4>วัตถุดิบ</h4>
    <ul class="ing-list" id="readerIngredients"></ul>
    <h4>วิธีทำ</h4>
    <ol class="step-list" id="readerSteps"></ol>
  </div>
</div>

const safeStorage = {
  get(key, fallback){ try{ return localStorage.getItem(key) ?? fallback; } catch(e){ return fallback; } },
  set(key, value){ try{ localStorage.setItem(key, value); return true; } catch(e){ return false; } }
};
let initialFavs = [];
try{ initialFavs = JSON.parse(safeStorage.get("kw_favs","[]")); }catch(e){ initialFavs = []; }

const state = { query:"", cuisine:"ทั้งหมด", tab:"home", favs:initialFavs, openId:null };
const cuisines = ["ทั้งหมด", ...new Set(RECIPES.map(r=>r.cuisine))];
const $ = s => document.querySelector(s);
const listEl = $("#list"), chipsEl = $("#chips"), searchEl = $("#search"), reader = $("#reader");

function renderChips(){
  chipsEl.innerHTML = cuisines.map(c =>
    `<button class="chip ${c===state.cuisine?"active":""}" data-c="${c}">${c}</button>`
  ).join("");
  chipsEl.querySelectorAll(".chip").forEach(b => b.onclick = () => { state.cuisine = b.dataset.c; render(); });
}

function filtered(){
  return RECIPES.filter(r=>{
    const matchC = state.cuisine==="ทั้งหมด" || r.cuisine===state.cuisine;
    const matchQ = r.name.toLowerCase().includes(state.query.toLowerCase());
    const matchFav = state.tab!=="fav" || state.favs.includes(r.id);
    return matchC && matchQ && matchFav;
  });
}

function toggleFav(id){
  state.favs = state.favs.includes(id) ? state.favs.filter(x=>x!==id) : [...state.favs, id];
  safeStorage.set("kw_favs", JSON.stringify(state.favs));
}

function render(){
  renderChips();
  const list = filtered();
  $("#count").textContent = `${list.length} เมนู`;
  listEl.innerHTML = list.length ? list.map(r=>`
    <div class="entry" data-open="${r.id}">
      <div class="emoji">${r.emoji}</div>
      <div>
        <div class="meta-top">${r.cuisine} · ${r.time} · ${r.diff}</div>
        <h3>${r.name}</h3>
        <div class="sub">${r.ingredients.length} วัตถุดิบ · ${r.steps.length} ขั้นตอน</div>
      </div>
      <button class="fav-btn ${state.favs.includes(r.id)?"active":""}" data-fav="${r.id}" aria-label="บันทึกรายการโปรด">${state.favs.includes(r.id)?"♥":"♡"}</button>
    </div>`).join("") : `<div class="empty">ไม่พบเมนูที่ค้นหา</div>`;

  listEl.querySelectorAll("[data-open]").forEach(c=>c.onclick = () => openRecipe(+c.dataset.open));
  listEl.querySelectorAll("[data-fav]").forEach(b=>b.onclick = (e)=>{
    e.stopPropagation();
    toggleFav(+b.dataset.fav);
    render();
  });
}

function openRecipe(id){
  const r = RECIPES.find(x=>x.id===id);
  state.openId = id;
  $("#readerEmoji").textContent = r.emoji;
  $("#readerCuisine").textContent = r.cuisine;
  $("#readerName").textContent = r.name;
  $("#readerMeta").innerHTML = `<span>${r.time}</span><span>ระดับ ${r.diff}</span>`;
  $("#readerIngredients").innerHTML = r.ingredients.map((i,idx)=>
    `<li data-idx="${idx}"><span class="box"></span><span class="txt">${i}</span></li>`
  ).join("");
  $("#readerSteps").innerHTML = r.steps.map((s,idx)=>
    `<li><span class="step-num">${idx+1}</span><p>${s}</p></li>`
  ).join("");
  updateReaderFav();
  reader.querySelectorAll(".ing-list li").forEach(li=> li.onclick = () => li.classList.toggle("checked"));
  reader.classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeReader(){
  reader.classList.remove("open");
  document.body.style.overflow = "";
  render();
}

function updateReaderFav(){
  const btn = $("#readerFav");
  const active = state.favs.includes(state.openId);
  btn.textContent = active ? "♥" : "♡";
  btn.classList.toggle("active", active);
}

$("#backBtn").onclick = closeReader;
$("#readerFav").onclick = () => { toggleFav(state.openId); updateReaderFav(); };

searchEl.oninput = e => { state.query = e.target.value; render(); };

$("#shuffleBtn").onclick = () => {
  const pool = filtered();
  if(!pool.length) return;
  openRecipe(pool[Math.floor(Math.random()*pool.length)].id);
};

document.querySelectorAll("nav.tabbar button").forEach(b=>{
  b.onclick = () => {
    document.querySelectorAll("nav.tabbar button").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    state.tab = b.dataset.tab;
    render();
  };
});

render();

let deferredPrompt;
window.addEventListener("beforeinstallprompt",(e)=>{
  e.preventDefault(); deferredPrompt = e; $("#installToast").classList.add("show");
});
$("#installBtn").onclick = async () => {
  if(!deferredPrompt) return;
  deferredPrompt.prompt(); await deferredPrompt.userChoice;
  deferredPrompt = null; $("#installToast").classList.remove("show");
};
</script>
</body>
</html>
